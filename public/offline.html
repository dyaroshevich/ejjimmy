<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF8A00">
  <title>Offline | Tawan Power</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #FFF7ED;
      color: #0F172A;
      text-align: center;
      padding: 20px;
    }
    img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(255,138,0,.25); }
    h1 { font-size: 24px; margin: 0 0 10px; }
    p { font-size: 16px; margin: 0 0 20px; color: #64748B; }
    button {
      background-color: #EA580C;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 999px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(234,88,12,.35);
    }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <img src="/icons/icon-192x192.png" alt="Tawan Power">
  <h1 id="t">ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
  <p id="s">โปรดตรวจสอบการเชื่อมต่อของคุณและลองใหม่อีกครั้ง</p>
  <button id="b" onclick="window.location.reload()">โหลดใหม่</button>
  <script>
    if ((navigator.language || 'th').slice(0, 2) !== 'th') {
      document.documentElement.lang = 'en';
      document.getElementById('t').textContent = 'You are offline';
      document.getElementById('s').textContent = 'Check your connection and try again';
      document.getElementById('b').textContent = 'Reload';
    }
    window.addEventListener('online', function () { window.location.reload(); });
  </script>
</body>
</html>
