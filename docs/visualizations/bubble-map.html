<style>
:root{--sand:#faf8f4;--sand1:#f4f2ee;--sand3:#d8d0c4;--amber:#a06808;--txt:#2a2520;--txt2:#6a6560;--txt3:#999}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--sand);color:var(--txt);overflow:hidden;height:100vh}

.hdr{position:fixed;top:0;left:0;right:0;height:44px;background:rgba(250,248,244,0.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(216,208,196,0.5);display:flex;align-items:center;padding:0 16px;z-index:100;gap:12px}
.logo{font-family:'Fraunces',serif;font-weight:700;font-size:14px;color:var(--amber);letter-spacing:-0.02em;white-space:nowrap}
.logo span{color:var(--txt3);font-weight:400;font-size:11px;font-family:'DM Sans',sans-serif;margin-left:6px}
.hstats{font-size:10.5px;color:var(--txt2);display:flex;gap:10px}
.hstats b{color:var(--amber);font-weight:600}
.srch{position:relative;margin-left:auto}
.srch input{width:170px;padding:4px 10px 4px 24px;border:1px solid var(--sand3);border-radius:5px;background:var(--sand1);font:inherit;font-size:11px;color:var(--txt);outline:none;transition:border-color .12s}
.srch input:focus{border-color:#c8942a}
.srch svg{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:11px;height:11px;stroke:var(--txt3);fill:none;stroke-width:2}

svg#bubbles{position:fixed;top:44px;left:0;right:0;bottom:0;transition:right .3s ease}
body.panel-open svg#bubbles{right:420px}

.tip{position:fixed;background:#fffcf8;border:1px solid var(--sand3);border-radius:6px;padding:8px 12px;font-size:11.5px;pointer-events:none;opacity:0;z-index:200;max-width:260px;box-shadow:0 3px 12px rgba(42,37,32,0.07);transition:opacity .1s}
.tip.on{opacity:1}
.tip b{display:block;font-family:'Fraunces',serif;font-weight:600;font-size:12px;color:var(--txt);margin-bottom:1px}
.tip .d{color:var(--txt2);font-size:10.5px;line-height:1.35}
.tip .p{margin-top:3px;font-size:9.5px;font-weight:600;color:var(--amber);letter-spacing:0.03em}
.tip .cnt{margin-top:2px;font-size:9.5px;color:var(--txt3)}

.ctrls{position:fixed;bottom:10px;left:10px;display:flex;gap:3px;z-index:80}
.cb{width:26px;height:26px;border-radius:5px;border:1px solid var(--sand3);background:rgba(250,248,244,0.85);backdrop-filter:blur(6px);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--txt2);transition:all .12s}
.cb:hover{background:var(--sand1);color:var(--txt);border-color:#c8942a}
.cb svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}

.bcrumb{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(250,248,244,0.9);backdrop-filter:blur(6px);border:1px solid rgba(216,208,196,0.5);border-radius:6px;padding:5px 12px;z-index:80;font-size:10.5px;color:var(--txt2);cursor:pointer;transition:all .12s;display:none}
.bcrumb:hover{background:var(--sand1);color:var(--txt)}
.bcrumb.on{display:block}

.leg{position:fixed;bottom:10px;right:10px;background:rgba(250,248,244,0.9);backdrop-filter:blur(6px);border:1px solid rgba(216,208,196,0.5);border-radius:6px;padding:8px 12px;z-index:80;font-size:9.5px;color:var(--txt3);display:flex;flex-wrap:wrap;gap:4px 12px;transition:right .3s ease}
body.panel-open .leg{right:430px}
.li{display:flex;align-items:center;gap:4px}
.ld{width:5px;height:5px;border-radius:50%}

/* Doc panel */
.panel{position:fixed;top:44px;right:-420px;width:420px;bottom:0;background:rgba(250,248,244,0.96);backdrop-filter:blur(12px);border-left:1px solid rgba(216,208,196,0.5);z-index:95;transition:right .3s ease;display:flex;flex-direction:column}
body.panel-open .panel{right:0}
.panel-head{padding:14px 16px 10px;border-bottom:1px solid rgba(216,208,196,0.4);display:flex;align-items:flex-start;gap:10px;flex-shrink:0}
.panel-title{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--txt);flex:1;line-height:1.3}
.panel-path{font-size:10px;color:var(--txt3);margin-top:2px;font-family:monospace}
.panel-sec{display:inline-block;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:4px;margin-top:4px;color:#fff}
.panel-close{width:24px;height:24px;border-radius:5px;border:1px solid var(--sand3);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--txt3);flex-shrink:0;transition:all .12s}
.panel-close:hover{background:var(--sand1);color:var(--txt)}
.panel-close svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.panel-body{flex:1;overflow-y:auto;padding:16px;font-size:13px;line-height:1.65;color:var(--txt2)}
.panel-body::-webkit-scrollbar{width:4px}
.panel-body::-webkit-scrollbar-thumb{background:var(--sand3);border-radius:4px}
.panel-body h1{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--txt);margin:0 0 12px;line-height:1.2}
.panel-body h2{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--txt);margin:20px 0 8px;line-height:1.25;border-bottom:1px solid var(--sand3);padding-bottom:4px}
.panel-body h3{font-size:13px;font-weight:600;color:var(--txt);margin:14px 0 6px}
.panel-body h4{font-size:12px;font-weight:600;color:var(--txt2);margin:10px 0 4px}
.panel-body p{margin:0 0 8px}
.panel-body ul,.panel-body ol{margin:0 0 8px;padding-left:20px}
.panel-body li{margin-bottom:3px}
.panel-body code{background:var(--sand1);padding:1px 4px;border-radius:3px;font-size:11.5px;font-family:'SF Mono',Consolas,monospace;color:#7c4a6b}
.panel-body pre{background:var(--sand1);border:1px solid var(--sand3);border-radius:6px;padding:10px 12px;overflow-x:auto;margin:8px 0;font-size:11px;line-height:1.5}
.panel-body pre code{background:none;padding:0;color:var(--txt)}
.panel-body a{color:var(--amber);text-decoration:none}
.panel-body a:hover{text-decoration:underline}
.panel-body blockquote{border-left:3px solid var(--sand3);padding-left:12px;margin:8px 0;color:var(--txt3)}
.panel-body table{border-collapse:collapse;width:100%;margin:8px 0;font-size:11.5px}
.panel-body th,.panel-body td{border:1px solid var(--sand3);padding:5px 8px;text-align:left}
.panel-body th{background:var(--sand1);font-weight:600}
.panel-empty{color:var(--txt3);font-style:italic;text-align:center;padding:40px 20px}
.panel-loading{color:var(--txt3);text-align:center;padding:40px 20px}

  {name:"Bugs",g:"bug",children:[
    {name:"PDF_BUG.md",p:"P0"},{name:"BUG_REPORT.md",p:"P0"},
    {name:"CHAT_API.md",p:"P1"},{name:"FLICKER.md",p:"P1"},{name:"NOTIF.md",p:"P2"}
  ]},
  {name:"Blog",g:"blog",children:[
    {name:"blog.sql",p:"P1"},{name:"article_2.sql",p:"P1"},
    {name:"article_3.sql",p:"P1"},{name:"article_4.sql",p:"P1"}
  ]},
  {name:"Plans",g:"plan",children:[
    {name:"localization.md",p:"P1"},{name:"redis.md",p:"P2"},
    {name:"LIFF.md",p:"P1"},{name:"FLEX_SPEC.md",p:"P1"}
  ]},
  {name:"Review",g:"review",children:[
    {name:"MASTER.md",p:"P1"},{name:"security.md",p:"P0"},
    {name:"typescript.md",p:"P1"},{name:"react.md",p:"P1"}
  ]}
]};

// Legend
var leg=document.getElementById('legend');
Object.keys(cats).forEach(function(k){
  var d=document.createElement('div');d.className='li';
  d.innerHTML='<span class="ld" style="background:'+cats[k].c+'"></span>'+cats[k].l;
  leg.appendChild(d);
});

// SVG
var svgEl=document.getElementById('bubbles');
var W=window.innerWidth,H=window.innerHeight-44;
svgEl.setAttribute('width',W);
svgEl.setAttribute('height',H);
var svg=d3.select('#bubbles');
var gMain=svg.append('g');

var zoomB=d3.zoom()
  .scaleExtent([0.1,8])
  .on('zoom',function(e){gMain.attr('transform',e.transform);});
svg.call(zoomB);

// Hierarchy + circle pack
var root=d3.hierarchy(treeData)
  .sum(function(d){return d.children?0:(d.p==='P0'?3:d.p==='P1'?2:1);})
  .sort(function(a,b){return b.value-a.value;});

var pack=d3.pack()
  .size([Math.min(W,H)-80, Math.min(W,H)-80])
  .padding(function(d){return d.depth===1?6:3;});

pack(root);

document.getElementById('hN').textContent=root.leaves().length;

function nodeColor(d){
  if(d.depth===0)return'#faf8f4';
  if(d.depth===1){var g=d.data.g;return cats[g]?cats[g].c:'#bbb';}
  var g=d.parent&&d.parent.data.g;
  var base=cats[g]?cats[g].c:'#bbb';
  return d.data.p==='P0'?base:base+'99';
}
function nodeStroke(d){
  if(d.depth===0)return'#ddd';
  if(d.depth===1)return nodeColor(d);
  return nodeColor(d)+'66';
}

var section=gMain.selectAll('.section')
  .data(root.children).join('g').attr('class','section')
  .attr('transform',function(d){
    return 'translate('+(d.x-Math.min(W,H)/2+40)+','+(d.y-Math.min(W,H)/2+40)+')';
  });

section.append('circle')
  .attr('r',function(d){return d.r;})
  .attr('fill',function(d){return nodeColor(d)+'12';})
  .attr('stroke',function(d){return nodeColor(d)+'40';})
  .attr('stroke-width',1.5).style('cursor','pointer')
  .on('click',function(e,d){zoomToSection(d);});

section.append('text').attr('text-anchor','middle').attr('dy','-0.2em')
  .text(function(d){return d.data.name;})
  .attr('font-size',function(d){return Math.max(9,d.r/8)+'px';})
  .attr('font-weight',600).attr('fill',function(d){return nodeColor(d);})
  .attr('font-family','Fraunces,serif').style('pointer-events','none');

section.append('text').attr('text-anchor','middle').attr('dy','1em')
  .text(function(d){return d.children.length+' docs';})
  .attr('font-size',function(d){return Math.max(7,d.r/10)+'px';})
  .attr('fill',function(d){return nodeColor(d)+'88';}).style('pointer-events','none');

var leaf=gMain.selectAll('.leaf')
  .data(root.leaves()).join('circle').attr('class','leaf')
  .attr('cx',function(d){return d.x-Math.min(W,H)/2+40;})
  .attr('cy',function(d){return d.y-Math.min(W,H)/2+40;})
  .attr('r',function(d){return d.r;})
  .attr('fill',function(d){return nodeColor(d);})
  .attr('stroke',function(d){return nodeStroke(d);})
  .attr('stroke-width',0.8).attr('opacity',0.85).style('cursor','pointer');

// Tooltip
var tip=document.getElementById('tip');
leaf.on('mouseover',function(e,d){
  tip.classList.add('on');
  tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-8)+'px';
  document.getElementById('tT').textContent=d.data.name;
  document.getElementById('tD').textContent=d.parent?d.parent.data.name:'';
  document.getElementById('tP').textContent=d.data.p||'';
  document.getElementById('tC').textContent='Клик чтобы открыть';
  leaf.attr('opacity',function(n){return n.parent===d.parent?0.95:0.15;});
  section.select('circle').attr('opacity',function(s){return s===d.parent?1:0.3;});
}).on('mousemove',function(e){
  tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-8)+'px';
}).on('mouseout',function(){
  tip.classList.remove('on');
  leaf.attr('opacity',0.85);section.select('circle').attr('opacity',1);
});

// Click → open panel
leaf.on('click',function(e,d){
  e.stopPropagation();
  openDoc(d);
});

section.on('mouseover',function(e,d){
  document.getElementById('tT').textContent=d.data.name;
  document.getElementById('tD').textContent=d.children.length+' документов';
  document.getElementById('tP').textContent='';
  document.getElementById('tC').textContent='Нажми чтобы приблизить';
  tip.classList.add('on');
  tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-8)+'px';
}).on('mousemove',function(e){
  tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-8)+'px';
}).on('mouseout',function(){tip.classList.remove('on');});

// Panel logic
var panel=document.getElementById('panel');
var data=window.DOCS_DATA||{};

function openDoc(d){
  var shortName=d.data.name;
  var fullName=resolveFile(shortName);
  var secName=d.parent?d.parent.data.name:'';
  var secColor=cats[d.parent&&d.parent.data.g]?cats[d.parent.data.g].c:'#999';

  document.getElementById('pTitle').textContent=shortName;
  document.getElementById('pPath').textContent=fullName;
  var secEl=document.getElementById('pSec');
  secEl.textContent=secName;
  secEl.style.background=secColor;

  var body=document.getElementById('pBody');
  var entry=data[fullName];

  if(entry&&entry.content){
    try{
      body.innerHTML=marked.parse(entry.content);
    }catch(ex){
      body.textContent=entry.content;
    }
  }else{
    // Try partial match
    var keys=Object.keys(data);
    var match=keys.find(function(k){return k.indexOf(fullName.replace('.md',''))>=0;});
    if(match&&data[match].content){
      try{body.innerHTML=marked.parse(data[match].content);}
      catch(ex){body.textContent=data[match].content;}
    }else{
      body.innerHTML='<div class="panel-empty">Файл не найден в данных.<br><small>Запусти <code>node generate-docs.js</code> чтобы обновить.</small></div>';
    }
  }

  document.body.classList.add('panel-open');
  // Resize SVG
  setTimeout(function(){
    var newW=window.innerWidth-(document.body.classList.contains('panel-open')?420:0);
    svgEl.setAttribute('width',newW);
  },50);
}

document.getElementById('pClose').onclick=function(){
  document.body.classList.remove('panel-open');
  setTimeout(function(){
    svgEl.setAttribute('width',window.innerWidth);
  },50);
};

// Zoom
var currentSection=null;
function zoomToSection(d){
  currentSection=d;
  var scale=Math.min(W,H)/(d.r*2.5);
  var tx=W/2-d.x*scale;var ty=H/2-d.y*scale;
  svg.transition().duration(500).call(zoomB.transform,d3.zoomIdentity.translate(tx,ty).scale(scale));
  document.getElementById('breadcrumb').classList.add('on');
  section.select('circle').transition().duration(300).attr('opacity',function(s){return s===d?1:0.15;});
  section.selectAll('text').transition().duration(300).attr('opacity',function(){return 0.3;});
}

document.getElementById('breadcrumb').onclick=function(){
  currentSection=null;resetView();
  document.getElementById('breadcrumb').classList.remove('on');
  section.select('circle').transition().duration(300).attr('opacity',1);
  section.selectAll('text').transition().duration(300).attr('opacity',1);
};

function resetView(){
  var s=Math.min(W,H)/(Math.min(W,H)-80)*0.85;
  svg.transition().duration(400).call(zoomB.transform,d3.zoomIdentity.translate(W/2,H/2).scale(s));
}
resetView();

document.getElementById('bIn').onclick=function(){svg.transition().duration(250).call(zoomB.scaleBy,1.4);};
document.getElementById('bOut').onclick=function(){svg.transition().duration(250).call(zoomB.scaleBy,0.7);};
document.getElementById('bRst').onclick=function(){
  currentSection=null;document.getElementById('breadcrumb').classList.remove('on');resetView();
  section.select('circle').transition().duration(300).attr('opacity',1);
  section.selectAll('text').transition().duration(300).attr('opacity',1);
};

document.getElementById('search').addEventListener('input',function(e){
  var q=e.target.value.toLowerCase();
  if(!q){leaf.attr('opacity',0.85);section.select('circle').attr('opacity',1);return;}
  leaf.attr('opacity',function(d){return d.data.name.toLowerCase().indexOf(q)>=0?0.95:0.08;});
  section.select('circle').attr('opacity',function(s){
    return s.children.some(function(c){return c.data.name.toLowerCase().indexOf(q)>=0;})?1:0.15;
  });
});

})();
}
</script>
</body>
</html>
