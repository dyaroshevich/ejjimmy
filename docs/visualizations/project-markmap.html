<meta charset="UTF-8">

<title>TAWAN POWER — Mindmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--sand:#faf8f4;--sand1:#f4f2ee;--sand3:#d8d0c4;--amber:#a06808;--txt:#2a2520;--txt2:#6a6560;--txt3:#999}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--sand);color:var(--txt);overflow:hidden;height:100vh}

.hdr{position:fixed;top:0;left:0;right:0;height:44px;background:rgba(250,248,244,0.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(216,208,196,0.5);display:flex;align-items:center;padding:0 16px;z-index:100;gap:12px}
.logo{font-family:'Fraunces',serif;font-weight:700;font-size:14px;color:var(--amber);letter-spacing:-0.02em;white-space:nowrap}
.logo span{color:var(--txt3);font-weight:400;font-size:11px;font-family:'DM Sans',sans-serif;margin-left:6px}
.stats{font-size:10.5px;color:var(--txt2);display:flex;gap:10px}
.stats b{color:var(--amber);font-weight:600}
.srch{position:relative;margin-left:auto}
.srch input{width:170px;padding:4px 10px 4px 24px;border:1px solid var(--sand3);border-radius:5px;background:var(--sand1);font:inherit;font-size:11px;color:var(--txt);outline:none;transition:border-color .12s}
.srch input:focus{border-color:#c8942a}
.srch svg{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:11px;height:11px;stroke:var(--txt3);fill:none;stroke-width:2}

svg#tree{position:fixed;top:44px;left:0;right:0;bottom:0;transition:right .3s ease}
body.panel-open svg#tree{right:420px}

.link{fill:none;stroke:#d0c8b8;stroke-width:1}
.link.root{stroke:#b8b0a0;stroke-width:1.5}

.node circle{cursor:pointer;transition:r .12s,opacity .12s}
.node text{font-family:'DM Sans',sans-serif;fill:var(--txt2)}
.node:hover circle{filter:brightness(1.12)}

.tip{position:fixed;background:#fffcf8;border:1px solid var(--sand3);border-radius:6px;padding:8px 12px;font-size:11.5px;pointer-events:none;opacity:0;z-index:200;max-width:260px;box-shadow:0 3px 12px rgba(42,37,32,0.07);transition:opacity .1s}
.tip.on{opacity:1}
.tip b{display:block;font-family:'Fraunces',serif;font-weight:600;font-size:12px;color:var(--txt);margin-bottom:1px}
.tip .d{color:var(--txt2);font-size:10.5px;line-height:1.35}
.tip .p{margin-top:3px;font-size:9.5px;font-weight:600;color:var(--amber);letter-spacing:0.03em}

.ctrls{position:fixed;bottom:10px;left:10px;display:flex;gap:3px;z-index:80}
.cb{width:26px;height:26px;border-radius:5px;border:1px solid var(--sand3);background:rgba(250,248,244,0.85);backdrop-filter:blur(6px);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--txt2);transition:all .12s}
.cb:hover{background:var(--sand1);color:var(--txt);border-color:#c8942a}
.cb svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}

.leg{position:fixed;bottom:10px;right:10px;background:rgba(250,248,244,0.9);backdrop-filter:blur(6px);border:1px solid rgba(216,208,196,0.5);border-radius:6px;padding:8px 12px;z-index:80;font-size:9.5px;color:var(--txt3);display:flex;flex-wrap:wrap;gap:4px 12px;transition:right .3s ease}
body.panel-open .leg{right:430px}
.li{display:flex;align-items:center;gap:4px}
.ld{width:5px;height:5px;border-radius:50%}

/* Doc panel */
.panel{position:fixed;top:44px;right:-420px;width:420px;bottom:0;background:rgba(250,248,244,0.96);backdrop-filter:blur(12px);border-left:1px solid rgba(216,208,196,0.5);z-index:95;transition:right .3s ease;display:flex;flex-direction:column}
body.panel-open .panel{right:0}
.panel-head{padding:14px 16px 10px;border-bottom:1px solid rgba(216,208,196,0.4);display:flex;align-items:flex-start;gap:10px;flex-shrink:0}
.panel-title{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--txt);flex:1;line-height:1.3}
.panel-path{font-size:10px;color:var(--txt3);margin-top:2px;font-family:monospace}
.panel-sec{display:inline-block;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:4px;margin-top:4px;color:#fff}
.panel-close{width:24px;height:24px;border-radius:5px;border:1px solid var(--sand3);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--txt3);flex-shrink:0;transition:all .12s}
.panel-close:hover{background:var(--sand1);color:var(--txt)}
.panel-close svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.panel-body{flex:1;overflow-y:auto;padding:16px;font-size:13px;line-height:1.65;color:var(--txt2)}
.panel-body::-webkit-scrollbar{width:4px}
.panel-body::-webkit-scrollbar-thumb{background:var(--sand3);border-radius:4px}
.panel-body h1{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--txt);margin:0 0 12px;line-height:1.2}
.panel-body h2{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--txt);margin:20px 0 8px;line-height:1.25;border-bottom:1px solid var(--sand3);padding-bottom:4px}
.panel-body h3{font-size:13px;font-weight:600;color:var(--txt);margin:14px 0 6px}
.panel-body h4{font-size:12px;font-weight:600;color:var(--txt2);margin:10px 0 4px}
.panel-body p{margin:0 0 8px}
.panel-body ul,.panel-body ol{margin:0 0 8px;padding-left:20px}
.panel-body li{margin-bottom:3px}
.panel-body code{background:var(--sand1);padding:1px 4px;border-radius:3px;font-size:11.5px;font-family:'SF Mono',Consolas,monospace;color:#7c4a6b}
.panel-body pre{background:var(--sand1);border:1px solid var(--sand3);border-radius:6px;padding:10px 12px;overflow-x:auto;margin:8px 0;font-size:11px;line-height:1.5}
.panel-body pre code{background:none;padding:0;color:var(--txt)}
.panel-body a{color:var(--amber);text-decoration:none}
.panel-body a:hover{text-decoration:underline}
.panel-body blockquote{border-left:3px solid var(--sand3);padding-left:12px;margin:8px 0;color:var(--txt3)}
.panel-body table{border-collapse:collapse;width:100%;margin:8px 0;font-size:11.5px}
.panel-body th,.panel-body td{border:1px solid var(--sand3);padding:5px 8px;text-align:left}
.panel-body th{background:var(--sand1);font-weight:600}
.panel-empty{color:var(--txt3);font-style:italic;text-align:center;padding:40px 20px}
</style>
</head>

treeLayout(root);

var nc=0,lc=0;
root.leaves().forEach(function(){nc++;});

document.getElementById('nN').textContent=nc;
document.getElementById('nE').textContent=lc;

// Draw links
gMain.selectAll('.link')
  .data(root.links())
  .join('path')
  .attr('class',function(d){return d.source.depth===0?'link root':'link';})
  .attr('d',function(d){
    return 'M'+d.source.y+','+d.source.x
      +'C'+(d.source.y+d.target.y)/2+','+d.source.x
      +' '+(d.source.y+d.target.y)/2+','+d.target.x
      +' '+d.target.y+','+d.target.x;
  })
  .attr('stroke',function(d){
    var gn=d.target.data.g||d.source.data.g;
    return gn&&cats[gn]?cats[gn].c+'55':'#d0c8b8';
  });

var nodes=gMain.selectAll('.node')
  .data(root.descendants())
  .join('g')
  .attr('class','node')
  .attr('transform',function(d){return 'translate('+d.y+','+d.x+')';});

function resolveFile(short){
  if(nameMap[short])return nameMap[short];
  return short;
}

function openDoc(d){
  var shortName=d.data.name;
  var fullName=resolveFile(shortName);
  var secNode=d.parent;
  while(secNode&&secNode.depth!==1)secNode=secNode.parent;
  var secName=secNode?secNode.data.name:'';
  var secG=secNode?secNode.data.g:'';
  var secColor=cats[secG]?cats[secG].c:'#999';

  document.getElementById('pTitle').textContent=shortName;
  document.getElementById('pPath').textContent=fullName;
  var secEl=document.getElementById('pSec');
  secEl.textContent=secName;
  secEl.style.background=secColor;

  var body=document.getElementById('pBody');
  var entry=data[fullName];
  if(entry&&entry.content){
    try{body.innerHTML=marked.parse(entry.content);}
    catch(ex){body.textContent=entry.content;}
  }else{
    var keys=Object.keys(data);
    var match=keys.find(function(k){return k.indexOf(fullName.replace('.md',''))>=0;});
    if(match&&data[match].content){
      try{body.innerHTML=marked.parse(data[match].content);}
      catch(ex){body.textContent=data[match].content;}
    }else{
      body.innerHTML='<div class="panel-empty">Файл не найден.<br><small>Запусти <code>node generate-docs.js</code></small></div>';
    }
  }
  document.body.classList.add('panel-open');
  setTimeout(function(){svgEl.setAttribute('width',window.innerWidth-420);},50);
}

document.getElementById('pClose').onclick=function(){
  document.body.classList.remove('panel-open');
  setTimeout(function(){svgEl.setAttribute('width',window.innerWidth);},50);
};

nodes.on('mouseover.h',function(e,d){
  if(d.depth<1)return;
  var conn=new Set();
  conn.add(d);
  if(d.parent)conn.add(d.parent);
  if(d.children)d.children.forEach(function(c){conn.add(c);});
  if(d.parent&&d.parent.children)d.parent.children.forEach(function(c){conn.add(c);});

  nodes.select('circle').attr('opacity',function(n){return conn.has(n)?1:0.1;});
  nodes.select('text').attr('opacity',function(n){return conn.has(n)?1:0.1;});
  gMain.selectAll('.link').attr('opacity',function(l){
    return(l.source===d||l.target===d)?1:0.06;
  });
}).on('mouseout.h',function(){
  nodes.select('circle').attr('opacity',function(d){return d.depth===0?1:d.depth===1?0.85:0.7;});

  gMain.selectAll('.link').attr('opacity',1);
});
